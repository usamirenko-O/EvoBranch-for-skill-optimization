# Set endpoint variables before starting LiteLLM. MODEL values include a provider prefix.
model_list:
  - model_name: optimizer-llm
    litellm_params:
      model: os.environ/OPTIMIZER_MODEL
      api_base: os.environ/OPTIMIZER_BASE_URL
      api_key: os.environ/OPTIMIZER_API_KEY
      extra_body:
        thinking:
          type: disabled
  - model_name: solver-deepseek-flash
    litellm_params:
      model: os.environ/DEEPSEEK_MODEL
      api_base: os.environ/DEEPSEEK_BASE_URL
      api_key: os.environ/DEEPSEEK_API_KEY
      extra_body:
        thinking:
          type: disabled
  - model_name: solver-gpt-5-6-luna
    litellm_params:
      model: os.environ/LUNA_MODEL
      api_base: os.environ/LUNA_BASE_URL
      api_key: os.environ/LUNA_API_KEY
  - model_name: solver-qwen3-5-4b
    litellm_params:
      model: os.environ/QWEN_MODEL
      api_base: os.environ/QWEN_BASE_URL
      api_key: os.environ/QWEN_API_KEY
  - model_name: optimizer-embeddings
    litellm_params:
      model: openai/local-bge-small-en-v1.5
      api_base: http://127.0.0.1:8318/v1
      api_key: local
litellm_settings:
  drop_params: true
  num_retries: 3
